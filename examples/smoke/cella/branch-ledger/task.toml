schema_version = "1.2"

[task]
name = "titanium/cella-branch-ledger"
description = "A 13-command ledger whose parent leg completes under --on-completion pause: the step list it leaves behind is the fixture for `titanium branch show` and the --at trim."
keywords = ["smoke", "branch", "trim", "cella"]

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 1200.0

[environment]
build_timeout_sec = 900.0
memory_mb = 2048
allow_internet = false
